# Keep a single lockfile document for GitHub dependency graph and security alerts.
# https://github.com/dependabot/dependabot-core/issues/15904
# CI pins pnpm explicitly because this disables automatic package-manager switching.
pmOnFail: ignore
allowBuilds:
  '@prisma/engines': true
  core-js: true
  esbuild: true
  lefthook: true
  prisma: true
  protobufjs: true
  sharp: true
overrides:
  hono@<4.12.25: '>=4.12.25'
  nanoid@<3.3.18: '3.3.18'
  undici@>=7.23.0 <7.28.0: '>=7.28.0 <8'
  postcss-selector-parser@<6.1.5: '6.1.5'
  zod@>=4.0.0 <4.6.6: '4.6.7'
